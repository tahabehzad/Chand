# Administrative socket use only; the container entrypoint runs as postgres.
local   all        postgres                         peer
local   all        all                              reject

# HBA is first-match. Refuse plaintext TCP before any credential rule.
hostnossl all      all          0.0.0.0/0            reject
hostnossl all      all          ::/0                 reject
hostssl pish_dev   postgres     0.0.0.0/0            scram-sha-256
hostssl pish_dev   postgres     ::/0                 scram-sha-256
host    all        all          0.0.0.0/0            reject
host    all        all          ::/0                 reject
