# P0-T03 development profile, 1 GiB memory budget. Production is DEC-010.
listen_addresses = '*'
port = 5432
hba_file = '/etc/pish-postgres/pg_hba.conf'
password_encryption = 'scram-sha-256'

ssl = on
ssl_cert_file = '/run/pish-postgres-tls/server.crt'
ssl_key_file = '/run/pish-postgres-tls/server.key'
ssl_min_protocol_version = 'TLSv1.3'

wal_level = replica
max_wal_size = '4GB'
shared_buffers = '256MB'
effective_cache_size = '512MB'
work_mem = '8MB'
max_connections = 200
statement_timeout = '30s'
idle_in_transaction_session_timeout = '60s'
timezone = 'UTC'
log_timezone = 'UTC'

logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] user=%u db=%d '
log_statement = 'none'
log_min_duration_statement = 500
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_error_statement = 'panic'
log_error_verbosity = 'terse'
log_connections = on
log_disconnections = on

shared_preload_libraries = 'pgaudit'
# Enable classes at database level only AFTER CREATE EXTENSION in init.sql.
pgaudit.log = 'none'
pgaudit.log_relation = on
pgaudit.log_statement = off
pgaudit.log_parameter = off
pgaudit.log_client = off
