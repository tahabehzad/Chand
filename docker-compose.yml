services:
  db:
    image: postgres:16-alpine
    container_name: chand-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: chand_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chand-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@db:5432/chand_dev
      APP_ESTIMATION_ALLOW_SAMPLE_DATA: "true"
      ALLOWED_ORIGINS: http://localhost:5273,http://127.0.0.1:5273,http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chand-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5273:5273"

volumes:
  postgres_data:
