# ==========================================================================
# Pish Hesabdari — backend project definition
# Authority: docs/PISH_HESABDARI_HOLY_BIBLE.md §4.3, §4.12
# Spec:      REMEDIATED_TECHNICAL_SPECIFICATION_V2.md §3.1  (technology stack)
# Ops:       docs/specs/DEPLOYMENT.md §2.2  (repository layout)
# QA:        docs/specs/TESTING.md §3  (tooling), §3.1 (money-safety gate)
# Related:   WBS P0-T01 (repository and tooling baseline)
#
# Managed with uv.  `uv.lock` is committed; `uv sync --frozen` is the only
# permitted install command in CI and in the documented setup path.
#
# STATUS: dependency set is PROPOSED and awaits owner approval — see
# docs/DECISION_REQUIRED_FROM_OWNER.md (DEC-A / "dependency baseline").
# Exact versions are pinned by uv.lock, not by hand.
# ==========================================================================

[project]
name = "pish-hesabdari-backend"
version = "0.1.0"
description = "Pish Hesabdari (پیش‌حسابداری) — pre-employment compensation intelligence and evidentiary verification platform (backend)."
readme = "../README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Pish Hesabdari Engineering" }]

# --- runtime dependencies ---------------------------------------------------
# Only libraries named in the approved technology inventory are listed.
# Phase 2 components (PaddleOCR, pyHanko, pikepdf, OpenCV) are deliberately
# NOT declared here: they are Phase 2 and their deployment shape is not yet
# fixed. See docs/PHASE_0_BOOTSTRAP_PLAN.md §6.
dependencies = [
    # --- API / ASGI ---------------------------------------------------------
    "fastapi>=0.110,<1.0",                # REMEDIATED §3.1
    "uvicorn[standard]>=0.30,<1.0",        # REMEDIATED §3
    "pydantic>=2.7,<3.0",                 # REMEDIATED §3.1
    "pydantic-settings>=2.3,<3.0",        # SPEC-OPS-001 §5.1
    "python-multipart>=0.0.9,<1.0",       # document upload boundary

    # --- persistence --------------------------------------------------------
    "sqlalchemy[asyncio]>=2.0.30,<3.0",   # REMEDIATED §3.1
    "alembic>=1.13,<2.0",                 # EXECUTION_PLAN §5.3
    "asyncpg>=0.29,<1.0",                 # PostgreSQL 16 async driver

    # --- object storage (ADR-002) -------------------------------------------
    "boto3>=1.34,<2.0",                   # ADR-002 directive 1 (S3 API client)
    "botocore>=1.34,<2.0",

    # --- cryptography and identity (ADR-003, SPEC-AUTH-001) ------------------
    "cryptography>=42.0,<46.0",           # AES-256-GCM, pyHanko (Phase 2)
    "argon2-cffi>=23.1,<26.0",            # SPEC-AUTH-001 §4.1 (Argon2id)

    # --- domain / data -------------------------------------------------------
    "pyyaml>=6.0,<7.0",                   # statutory seed bootstrap
    "numpy>=1.26,<3.0",                   # statistical engine (M5)
    "scipy>=1.11,<2.0",                   # statistical engine (M5)
    "persiantools>=5.0,<7.0",             # Jalali / numerals (SPEC-FE-001 §10)
    "jdatetime>=4.1,<6.0",                # cross-check calendar library
    "email-validator>=2.1,<3.0",          # pydantic EmailStr
]

[project.optional-dependencies]
# Phase 2 — document intelligence. Not installed by default; see
# docs/PHASE_0_BOOTSTRAP_PLAN.md §6. Listed for traceability only.
documents = [
    "paddleocr>=2.7,<3.0",
    "pyhanko>=0.25,<1.0",
    "pikepdf>=8.12,<10.0",
    "opencv-python-headless>=4.9,<5.0",
    "pillow>=10.3,<12.0",
]
# PDF generation — DEC-006 is open; the pipeline choice is not yet approved.
pdf = [
    "weasyprint>=62,<67",
]

[dependency-groups]
dev = [
    # --- test -------------------------------------------------------------
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.100,<7.0",             # SPEC-QA-001 L2
    "schemathesis>=3.35,<4.0",            # SPEC-QA-001 L5 (OpenAPI 3.1)
    "httpx>=0.27,<1.0",                   # ASGI test client

    # --- static analysis --------------------------------------------------
    "ruff>=0.6,<1.0",                     # lint + format
    "mypy>=1.11,<2.0",                    # strict
    "bandit>=1.7,<2.0",                   # SPEC-QA-001 L11
    "pip-audit>=2.7,<3.0",                # SPEC-QA-001 L11

    # --- typing ------------------------------------------------------------
    "types-PyYAML>=6.0,<7.0",
]

[tool.pytest.ini_options]
# WBS P0-T02 — the test harness for the FastAPI skeleton.
# `pythonpath = ["."]` puts `backend/` on the path so that `import app...`
# resolves without installing the project as a package (uv `package = false`).
minversion = "8.2"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false
