# ==========================================================================
# Pish Hesabdari — Alembic configuration (WBS P0-T04)
#
# Authority:
#   docs/specs/DEPLOYMENT.md §4.2  (migration tool rules)
#   docs/specs/STATUTORY_DATABASE_CONTRACT.md §5  (environment contract)
#
# SECURITY (contract AC-13):
#   No credential, DSN or secret is stored in this file. `sqlalchemy.url` is
#   intentionally empty — backend/alembic/env.py reads the approved
#   DATABASE_URL variable through app.core.config (fail-closed when absent)
#   and never prints it.
#
# This is a development-only baseline. Production migration execution is a
# Stage-12 release gate (docs/specs/TESTING.md §15) and remains gated on the
# unselected CI provider (DEC-F open).
# ==========================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
# WARNING: a URL (with credentials) is only rendered at INFO/DEBUG. The
# migration output must never be raised to those levels.

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
