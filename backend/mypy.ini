# ==========================================================================
# Pish Hesabdari — mypy configuration
# Authority: docs/PISH_HESABDARI_HOLY_BIBLE.md §11.4
# QA:        docs/specs/TESTING.md §3  (mypy --strict)
# Related:   WBS P0-T01
#
# `mypy --strict` must be clean. The engines package additionally uses
# `disallow_any_explicit = True`: an `Any` in a statutory calculation is a
# precision defect waiting to happen, because it silently admits float.
# ==========================================================================

[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
warn_no_return = True
warn_unused_ignores = True
show_error_codes = True
pretty = True
namespace_packages = True
explicit_package_bases = True
mypy_path = "app"
# NOTE: this is an INI file.  A mypy plugin list is a plain comma-separated
# string here, NOT a TOML array — `plugins = ["pydantic.mypy"]` fails to import
# the plugin and aborts the whole run.
plugins = pydantic.mypy

# --- money core: no implicit Any anywhere -----------------------------------
[mypy-app.engines.*]
disallow_any_explicit = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_any_generics = True
warn_return_any = True
no_implicit_optional = True

# --- persistence: SQLAlchemy mapped columns are typed via the ORM -----------
[mypy-app.models.*]
disallow_untyped_defs = True
warn_unused_ignores = False

# --- tests are allowed to be looser but not untyped --------------------------
[mypy-tests.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
ignore_missing_imports = True

# --- third-party without type information -----------------------------------
[mypy-boto3.*]
ignore_missing_imports = True
[mypy-botocore.*]
ignore_missing_imports = True
[mypy-paddleocr.*]
ignore_missing_imports = True
[mypy-pikepdf.*]
ignore_missing_imports = True
[mypy-cv2.*]
ignore_missing_imports = True
